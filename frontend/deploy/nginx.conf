server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://paper-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        # Cache-Control 和 ETag 由论文 API 返回；外层 CDN 应尊重源站响应头。
    }

    location /health {
        proxy_pass http://paper-api:8000/health;
        add_header Cache-Control "no-store" always;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|mp4)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate" always;
    }
}

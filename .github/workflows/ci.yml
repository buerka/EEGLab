name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            cloud-functions/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt -r cloud-functions/requirements.txt
      - name: Backend tests on Makers runtime version
        run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
      - run: npm --prefix frontend ci
      - run: npm run build
      - name: Check deployable inputs and frontend output
        run: python scripts/check_deployment.py
      - name: Package SCF (Linux Python 3.10, dependencies included)
        run: python scripts/package_scf.py
      - uses: actions/upload-artifact@v4
        with:
          name: eeglab-scf-python310
          path: output/eeglab-scf-python310.zip
          retention-days: 14
          if-no-files-found: error
